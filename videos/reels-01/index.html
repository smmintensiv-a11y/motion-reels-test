<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Reels #1 — motion layer</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
      body { font-family: "Montserrat", sans-serif; }

      :root {
        --bg-light: #efebe2;
        --bg-dark: #0a0a0a;
        --ink: #1a1a1a;
        --paper: #ffffff;
        --accent: #e5231c;
        --structural: #9a9a96;
      }

      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

      .clip { position: absolute; inset: 0; }

      /* ---- background stages (each one contiguous window, hard-cut between them) ---- */
      .stage { position: absolute; inset: 0; overflow: hidden; }
      .stage-light { background: var(--bg-light); }
      .stage-dark { background: var(--bg-dark); }
      .grid-dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(currentColor 1.6px, transparent 1.6px);
        background-size: 48px 48px;
        background-position: 0 0;
      }
      .stage-light .grid-dots { color: var(--structural); opacity: 0.08; }
      .stage-dark .grid-dots { color: var(--structural); opacity: 0.1; }

      /* ---- text band (y1520-1740, shared by every text accent) — unchanged ---- */
      .text-band {
        position: absolute; left: 60px; top: 1520px; width: 960px; height: 220px;
        display: flex; align-items: center; justify-content: center;
        text-align: center;
      }
      .text-band p {
        font-size: 92px; font-weight: 500; line-height: 1.12; letter-spacing: -0.01em;
      }
      .text-band .punch { font-weight: 900; letter-spacing: -0.02em; color: var(--accent); }
      .text-band.max-emphasis p { font-size: 100px; }
      .text-band.max-emphasis .punch { text-shadow: 0 0 34px rgba(229, 35, 28, 0.55); }

      /* ---- cursor (hook scene) — unchanged ---- */
      .cursor-wrap { position: absolute; width: 64px; height: 64px; }

      /* ================= CARD SYSTEM (episodes 1/2/4) ================= */
      .hero-card {
        position: absolute;
        background: var(--paper);
        border-radius: 26px;
        box-shadow: 0 26px 50px rgba(26, 26, 26, 0.18), 0 6px 14px rgba(26, 26, 26, 0.09);
        border: 1px solid rgba(26, 26, 26, 0.06);
      }
      .card-header {
        position: absolute; left: 0; top: 0; right: 0; height: 68px;
        background: rgba(154, 154, 150, 0.16);
        border-radius: 26px 26px 0 0;
      }
      .avatar-dot { position: absolute; border-radius: 50%; background: var(--ink); }
      .bar-strong { position: absolute; height: 24px; border-radius: 12px; background: var(--ink); }
      .bar-soft { position: absolute; height: 15px; border-radius: 8px; background: var(--structural); opacity: 0.55; }
      .media-block { position: absolute; border-radius: 18px; background: var(--structural); opacity: 0.28; }
      .corner-fold {
        position: absolute; left: 0; top: 0; width: 0; height: 0;
        border-style: solid; border-width: 30px 30px 0 0;
        border-color: rgba(26, 26, 26, 0.1) transparent transparent transparent;
        border-radius: 26px 0 0 0;
      }
      .header-rule { position: absolute; left: 0; right: 0; top: 68px; height: 1px; background: rgba(26, 26, 26, 0.08); }
      .tag-pill { position: absolute; height: 20px; padding: 0 10px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; }
      .tag-pill span { display: block; width: 26px; height: 4px; border-radius: 2px; background: var(--paper); }
      .proc-panel { position: absolute; left: 14px; top: 8px; right: 14px; bottom: 8px; border-radius: 16px; background: rgba(154, 154, 150, 0.1); }
      .corner-badge {
        position: absolute; width: 54px; height: 54px; border-radius: 50%;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 22px rgba(229, 35, 28, 0.38);
      }
      .corner-badge svg { width: 28px; height: 28px; color: var(--paper); }
      .check-badge {
        position: absolute; width: 54px; height: 54px; border-radius: 50%;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 22px rgba(229, 35, 28, 0.38);
        opacity: 0;
      }
      .check-badge svg { width: 32px; height: 32px; color: var(--paper); }

      /* Telegram-style bubble: dark fill, asymmetric tail corner */
      .bubble-dark {
        background: var(--ink);
        border-radius: 26px 26px 26px 6px;
        box-shadow: 0 26px 50px rgba(26, 26, 26, 0.24), 0 6px 14px rgba(26, 26, 26, 0.12);
      }
      .bubble-dark .bar-strong { background: var(--paper); }
      .bubble-dark .bar-soft { background: var(--paper); opacity: 0.4; }
      .tg-pill {
        position: absolute; height: 30px; border-radius: 15px;
        background: rgba(255, 255, 255, 0.14);
        display: flex; align-items: center; justify-content: center; gap: 4px;
        color: var(--paper);
      }
      .tg-pill svg { width: 16px; height: 16px; }

      /* ---- week card (episode 1) ---- */
      .week-shadow {
        position: absolute; left: 90px; top: 1080px; width: 900px; height: 240px;
        background: var(--paper); border-radius: 26px;
      }
      .day-cell {
        position: relative; width: 84px; height: 84px; border-radius: 20px;
        background: rgba(154, 154, 150, 0.14);
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 24px; color: var(--ink);
      }
      .day-badge {
        position: absolute; top: -8px; right: -8px; width: 22px; height: 22px;
        border-radius: 50%; background: var(--accent);
        box-shadow: 0 4px 10px rgba(229, 35, 28, 0.4);
      }

      /* ---- day-bar (episode 3) ---- */
      .day-bar-track {
        position: absolute; left: 90px; top: 1180px; width: 900px; height: 90px;
        border-radius: 45px; background: rgba(154, 154, 150, 0.2); overflow: hidden;
      }
      .day-bar-fill {
        position: absolute; left: 0; top: 0; height: 100%; width: 100%;
        border-radius: 45px; background: var(--ink);
        transform: scaleX(0); transform-origin: left center;
      }
      .day-bar-tick { position: absolute; top: 14px; width: 3px; height: 62px; background: var(--bg-light); opacity: 0.6; border-radius: 2px; }

      /* ---- voice bubble + processing (episode 4) ---- */
      .voice-bubble {
        position: absolute; left: 70px; top: 1080px; width: 300px; height: 70px;
        background: var(--ink); border-radius: 26px 26px 26px 6px;
        box-shadow: 0 26px 50px rgba(26, 26, 26, 0.24), 0 6px 14px rgba(26, 26, 26, 0.12);
        transform-origin: left center;
      }
      .voice-play {
        position: absolute; left: 18px; top: 50%; margin-top: -27px; width: 54px; height: 54px;
        border-radius: 50%; background: var(--paper);
        display: flex; align-items: center; justify-content: center;
      }
      .voice-wave { position: absolute; left: 92px; top: 0; right: 90px; bottom: 0; display: flex; align-items: center; gap: 5px; }
      .voice-wave i { display: block; width: 6px; border-radius: 3px; background: var(--paper); }
      .voice-duration {
        position: absolute; right: 16px; top: 50%; margin-top: -18px; height: 36px; padding: 0 14px;
        border-radius: 18px; background: rgba(255, 255, 255, 0.14);
        display: flex; align-items: center; color: var(--paper); font-weight: 600; font-size: 22px;
      }

      .processing-card {
        position: absolute; left: 390px; top: 1080px; width: 620px; height: 70px;
        background: var(--paper); border-radius: 26px;
        box-shadow: 0 22px 44px rgba(26, 26, 26, 0.16), 0 5px 12px rgba(26, 26, 26, 0.08);
        opacity: 0;
      }
      .proc-node { fill: var(--ink); transform-box: fill-box; transform-origin: center; }
      .proc-line { stroke: var(--structural); stroke-width: 2.5; }

      /* ---- 3-card row (episode 2 intro + episode 4 payoff) ---- */
      .row-card { position: absolute; top: 1170px; width: 300px; height: 280px; opacity: 0; }
      .slot-a { left: 70px; }
      .slot-b { left: 390px; }
      .slot-c { left: 710px; }
    </style>
  </head>

      <div class="clip row-card hero-card slot-a" id="card-envelope-2" data-start="32.0" data-duration="2.93">

        <div class="avatar-dot" style="left:20px; top:18px; width:36px; height:36px;"></div>
        <div class="bar-strong" style="left:24px; top:100px; width:200px;"></div>
        <div class="bar-soft" style="left:24px; top:136px; width:150px;"></div>
        <div class="tag-pill" style="left:24px; top:234px;"><span></span></div>
      </div>
      <div class="clip row-card bubble-dark slot-b" id="card-telegram-2" data-start="32.15" data-duration="2.78">
        <div class="bar-strong" style="left:24px; top:112px; width:180px;"></div>
        <div class="bar-soft" style="left:24px; top:148px; width:120px;"></div>
      </div>
      <div class="clip row-card hero-card slot-c" id="card-vk-2" data-start="32.3" data-duration="2.63">
        <div class="avatar-dot" style="left:20px; top:20px; width:44px; height:44px;"></div>
        <div class="bar-strong" style="left:76px; top:32px; width:130px; height:18px; border-radius:9px;"></div>
        <div class="media-block" style="left:20px; top:84px; width:260px; height:130px;"></div>
      </div>

      <div class="check-badge clip" id="check-1" data-start="32.5" data-duration="2.43" style="inset:auto; left:345px; top:1145px; right:auto; bottom:auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6" /></svg>
      </div>
      <div class="check-badge clip" id="check-2" data-start="32.6" data-duration="2.33" style="inset:auto; left:665px; top:1145px; right:auto; bottom:auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6" /></svg>
      </div>
      <div class="check-badge clip" id="check-3" data-start="32.7" data-duration="2.23" style="inset:auto; left:985px; top:1145px; right:auto; bottom:auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6" /></svg>
      </div>

      <div class="clip text-band" id="text-payoff" data-start="32.6" data-duration="2.33" style="color: var(--ink)">
        <p><span class="punch">готовый текст</span></p>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* ---------- EPISODE 1: weekly-routine card ---------- */
      tl.fromTo("#week-card", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 0.7);
      tl.fromTo(["#week-shadow-1", "#week-shadow-2"], { opacity: 0 }, { opacity: (i) => (i === 0 ? 0.32 : 0.18), duration: 0.4, ease: "power2.out" }, 0.78);
      tl.fromTo("#text-thesis p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.85);
      tl.fromTo("#badge-mon", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" }, 2.0);
      tl.fromTo("#badge-wed", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" }, 2.35);
      tl.fromTo("#badge-fri", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" }, 2.7);
      tl.to(["#week-card", "#week-shadow-1", "#week-shadow-2", "#text-thesis p"], { opacity: 0, scale: 0.94, duration: 0.2, ease: "power2.in" }, 8.9);
      tl.set(["#week-card", "#week-shadow-1", "#week-shadow-2", "#text-thesis p"], { opacity: 0 }, 9.1);

      /* ---------- EPISODE 2: 3 content cards ---------- */
      tl.fromTo("#card-envelope", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 9.2);
      tl.fromTo("#text-envelope p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 9.35);
      // envelope translates left to slot-a once telegram/vk join
      tl.to("#card-envelope", { x: -320, duration: 0.35, ease: "power2.inOut" }, 12.55);
      tl.to(["#card-envelope", "#text-envelope p"], { opacity: 0, scale: 0.94, duration: 0.2, ease: "power2.in" }, 14.45);
      tl.set(["#card-envelope", "#text-envelope p"], { opacity: 0 }, 14.65);

      tl.fromTo("#card-telegram", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, 12.55);
      tl.to("#card-telegram", { opacity: 0, scale: 0.94, duration: 0.2, ease: "power2.in" }, 14.45);
      tl.set("#card-telegram", { opacity: 0 }, 14.65);

      tl.fromTo("#card-vk", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, 12.9);
      tl.to("#card-vk", { opacity: 0, scale: 0.94, duration: 0.2, ease: "power2.in" }, 14.45);
      tl.set("#card-vk", { opacity: 0 }, 14.65);

      /* ---------- EPISODE 3: day-bar ---------- */
      tl.fromTo("#day-bar-track", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 14.7);
      tl.to("#day-bar-fill", { scaleX: 1, duration: 1.3, ease: "power2.out" }, 14.7);
      tl.fromTo("#text-day p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 14.85);
      tl.to("#text-day p", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, 16.3);
      tl.set("#text-day p", { opacity: 0 }, 16.5);

      // hard-cut scene flip to dark at 16.6 — recolor persistent bar + track
      tl.set(["#day-bar-fill"], { backgroundColor: "var(--paper)" }, 16.6);
      tl.set("#day-bar-track", { backgroundColor: "rgba(255,255,255,0.12)" }, 16.6);
      tl.to("#day-bar-fill", { opacity: 0.7, duration: 0.5, ease: "sine.inOut", repeat: 3, yoyo: true }, 16.8);

      tl.fromTo("#text-longway p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 16.7);
      tl.to("#text-longway p", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, 20.5);
      tl.set("#text-longway p", { opacity: 0 }, 20.7);

      /* ---------- SCENE C: поворот — the bar snaps down ---------- */
      tl.to("#day-bar-fill", { scaleX: 0.08, duration: 0.4, ease: "power3.inOut" }, 20.85);
      tl.to("#day-bar-track", { opacity: 0, duration: 0.3, ease: "power2.in" }, 21.35);
      tl.fromTo("#text-twist p", { y: 20, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)" }, 20.95);
      tl.to("#text-twist p", { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" }, 25.05);
      tl.set("#text-twist p", { opacity: 0 }, 25.3);

      /* ---------- SCENE D: hook — cursor click ---------- */
      tl.fromTo("#cursor", { opacity: 0, x: -120, y: -60 }, { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, 25.4);
      tl.to("#cursor", { scale: 0.85, duration: 0.12, ease: "power2.in" }, 26.55);
      tl.to("#cursor", { scale: 1, duration: 0.15, ease: "power2.out" }, 26.67);
      tl.fromTo("#click-ripple", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.8, duration: 0.5, ease: "power2.out" }, 26.55);
      tl.to("#cursor", { opacity: 0, duration: 0.2, ease: "power2.in" }, 27.35);
      tl.set("#cursor", { opacity: 0 }, 27.55);

      /* ---------- EPISODE 4: voice bubble -> processing -> payoff cards ---------- */
      // natural CSS = docked chip (70,1080,300x70). Big display = scaled-up transform.
      const BIG_SX = 800 / 300, BIG_SY = 240 / 70, BIG_DX = 70, BIG_DY = 145;
      tl.fromTo(
        "#voice-bubble",
        { scaleX: 0, scaleY: 0, x: BIG_DX, y: BIG_DY, opacity: 0 },
        { scaleX: BIG_SX, scaleY: BIG_SY, x: BIG_DX, y: BIG_DY, opacity: 1, duration: 0.4, ease: "back.out(1.4)" },
        27.75
      );
      tl.fromTo("#text-voice p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 27.9);
      gsap.utils.toArray("#voice-wave i").forEach((bar, i) => {
        tl.to(bar, { scaleY: 1.3, duration: 0.3, ease: "sine.inOut", repeat: 5, yoyo: true, transformOrigin: "50% 50%" }, 28.1 + i * 0.04);
      });
      tl.to("#text-voice p", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, 30.1);
      tl.set("#text-voice p", { opacity: 0 }, 30.3);

      // dock: voice bubble returns to its natural (chip) transform state
      tl.to("#voice-bubble", { scaleX: 1, scaleY: 1, x: 0, y: 0, duration: 0.25, ease: "power2.inOut" }, 30.3);

      tl.fromTo("#processing-card", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" }, 30.3);
      tl.fromTo("#text-system p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 30.45);
      tl.to("#text-system p", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, 31.7);
      tl.set("#text-system p", { opacity: 0 }, 31.9);
      ["#pn-1", "#pn-2", "#pn-3", "#pn-4", "#pn-5", "#pn-6"].forEach((sel, i) => {
        tl.fromTo(sel, { scale: 0.6 }, { scale: 1.15, duration: 0.35, ease: "sine.inOut", repeat: 5, yoyo: true }, 30.45 + i * 0.08);
      });

      // connector 1 draws in once dock completes
      const c1 = document.getElementById("connector-1-path");
      const c1len = c1 ? c1.getTotalLength() : 20;
      gsap.set("#connector-1-path", { strokeDasharray: c1len, strokeDashoffset: c1len });
      tl.to("#connector-1-path", { strokeDashoffset: 0, duration: 0.2, ease: "power2.inOut" }, 30.55);

      /* ---------- EPISODE 4 payoff ---------- */
      const c2 = document.getElementById("connector-2-path");
      const c2len = c2 ? c2.getTotalLength() : 20;
      gsap.set("#connector-2-path", { strokeDasharray: c2len, strokeDashoffset: c2len });
      tl.to("#connector-2-path", { strokeDashoffset: 0, duration: 0.2, ease: "power2.inOut" }, 31.9);

      tl.fromTo("#card-envelope-2", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" }, 32.0);
      tl.fromTo("#card-telegram-2", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" }, 32.15);
      tl.fromTo("#card-vk-2", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" }, 32.3);

      tl.fromTo("#check-1", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2)" }, 32.5);
      tl.fromTo("#check-2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2)" }, 32.6);
      tl.fromTo("#check-3", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2)" }, 32.7);

      tl.fromTo("#text-payoff p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 32.6);
      // settle-only tail into outro — no new keyframes after this, freeze holds
      tl.to("#check-3", { scale: 1.05, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 1 }, 32.95);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
