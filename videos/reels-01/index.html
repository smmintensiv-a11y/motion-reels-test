    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
      body { font-family: "Montserrat", sans-serif; }

      :root {
        --bg-light: #efebe2;
        --bg-dark: #0a0a0a;
        --ink: #1a1a1a;
        --paper: #ffffff;
        --accent: #e5231c;
        --structural: #9a9a96;
      }

      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

      .clip { position: absolute; inset: 0; }

      /* ---- background stages (each one contiguous window, hard-cut between them) ---- */
      .stage { position: absolute; inset: 0; overflow: hidden; }
      .stage-light { background: var(--bg-light); }
      .stage-dark { background: var(--bg-dark); }
      .grid-dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(currentColor 1.6px, transparent 1.6px);
        background-size: 48px 48px;
        background-position: 0 0;
      }
      .stage-light .grid-dots { color: var(--structural); opacity: 0.08; }
      .stage-dark .grid-dots { color: var(--structural); opacity: 0.1; }

      /* ---- content-safe zone helpers ---- */
      .icon-drift {
        position: absolute;
        width: 46px; height: 46px;
        color: var(--ink);
        opacity: 0.05;
      }
      .icon-drift svg { width: 100%; height: 100%; }

      /* ---- slot H : hero solo (x430-650, y1120-1340) ---- */
      .slot-h {
        position: absolute; left: 430px; top: 1120px; width: 220px; height: 220px;
        display: flex; align-items: center; justify-content: center;
      }
      .slot-h svg { width: 120px; height: 120px; }

      /* ---- slot C : 3-channel row (reused, y1300-1490) ---- */
      .slot-c-icon {
        position: absolute; top: 1300px; width: 190px; height: 190px;
        border-radius: 28px;
        display: flex; align-items: center; justify-content: center;
      }
      .slot-c-icon svg { width: 104px; height: 104px; }
      .slot-c-1 { left: 130px; }
      .slot-c-2 { left: 350px; }
      .slot-c-3 { left: 570px; }

      /* ---- slot D : docked compact chain (y1080-1210) ---- */
      .slot-d-icon {
        position: absolute; top: 1080px; width: 130px; height: 130px;
        border-radius: 22px;
        display: flex; align-items: center; justify-content: center;
      }
      .slot-d-icon svg { width: 72px; height: 72px; }
      .slot-d-voice { left: 100px; }
      .slot-d-system { left: 330px; }

      /* ---- text band (y1520-1740, shared by every text accent) ---- */
      .text-band {
        position: absolute; left: 60px; top: 1520px; width: 960px; height: 220px;
        display: flex; align-items: center; justify-content: center;
        text-align: center;
      }
      .text-band p {
        font-size: 92px; font-weight: 500; line-height: 1.12; letter-spacing: -0.01em;
      }
      .text-band .punch { font-weight: 900; letter-spacing: -0.02em; color: var(--accent); }
      .text-band.max-emphasis p { font-size: 100px; }
      .text-band.max-emphasis .punch { text-shadow: 0 0 34px rgba(229, 35, 28, 0.55); }

      /* ---- checkmark badge (55px, overlaid on channel icons) ---- */
      .badge {
        position: absolute; width: 55px; height: 55px; border-radius: 50%;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
      }
      .badge svg { width: 34px; height: 34px; color: var(--paper); }

      /* ---- cursor (hook scene) ---- */
      .cursor-wrap { position: absolute; width: 64px; height: 64px; }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* ---------- SCENE A: thesis ---------- */
      tl.fromTo("#icon-cycle", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.7);
      tl.fromTo("#text-thesis p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.85);
      // slow single-turn drift on the hero icon (thematic, finite)
      tl.fromTo("#icon-cycle svg", { rotation: 0 }, { rotation: 360, duration: 6.5, ease: "none", transformOrigin: "50% 50%" }, 1.2);
      // background icon-pattern drift: gentle finite diagonal wander
      ["#drift-1", "#drift-2", "#drift-3", "#drift-4"].forEach((sel, i) => {
        tl.fromTo(sel, { x: 0, y: 0 }, { x: 18, y: 14, duration: 4.2, ease: "sine.inOut", repeat: 1, yoyo: true }, 0.7 + i * 0.15);
      });
      // exit: cycle icon + thesis text fade+scale-down before channel row enters
      tl.to(["#icon-cycle", "#text-thesis p"], { opacity: 0, scale: 0.94, duration: 0.2, ease: "power2.in" }, 8.9);
      tl.set(["#icon-cycle", "#text-thesis p"], { opacity: 0 }, 9.1);

      /* ---------- SCENE A: 3 channels ---------- */
      tl.fromTo("#icon-envelope", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 9.2);
      tl.fromTo("#text-envelope p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 9.35);
      tl.to(["#icon-envelope", "#text-envelope p"], { opacity: 0, scale: 0.94, duration: 0.2, ease: "power2.in" }, 14.45);
      tl.set(["#icon-envelope", "#text-envelope p"], { opacity: 0 }, 14.65);

      tl.fromTo("#icon-telegram", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 12.55);
      tl.to("#icon-telegram", { opacity: 0, scale: 0.94, duration: 0.2, ease: "power2.in" }, 14.45);
      tl.set("#icon-telegram", { opacity: 0 }, 14.65);

      tl.fromTo("#icon-vk", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 12.9);
      tl.to("#icon-vk", { opacity: 0, scale: 0.94, duration: 0.2, ease: "power2.in" }, 14.45);
      tl.set("#icon-vk", { opacity: 0 }, 14.65);

      /* ---------- SCENE B/C: clock ---------- */
      tl.fromTo("#icon-clock", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 14.7);
      tl.fromTo("#text-day p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 14.85);
      tl.to("#text-day p", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, 16.3);
      tl.set("#text-day p", { opacity: 0 }, 16.5);

      // clock hand sweeps 3 full turns across the "day" — deterministic proxy + SVG-native rotate for exact center
      const handProxy = { deg: 0 };
      tl.to(handProxy, {
        deg: 1080, duration: 6.15, ease: "none",
        onUpdate: () => document.getElementById("clock-hand").setAttribute("transform", `rotate(${handProxy.deg} 12 12)`),
      }, 14.7);

      // hard-cut scene flip to dark at 16.6 (bg swap is automatic via stage clip windows; recolor persistent icon + text)
      tl.set("#icon-clock", { color: "var(--paper)" }, 16.6);

      tl.fromTo("#text-longway p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 16.7);
      tl.to("#text-longway p", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, 20.5);
      tl.set("#text-longway p", { opacity: 0 }, 20.7);

      /* ---------- SCENE C: поворот ---------- */
      // clock shrinks + fades — direct visualization of "time no longer spent"
      tl.to("#icon-clock", { scale: 0.25, opacity: 0, duration: 0.4, ease: "power2.inOut" }, 20.85);
      tl.fromTo("#text-twist p", { y: 20, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)" }, 20.95);
      tl.to("#text-twist p", { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" }, 25.05);
      tl.set("#text-twist p", { opacity: 0 }, 25.3);

      /* ---------- SCENE D: hook — cursor click ---------- */
      tl.fromTo("#cursor", { opacity: 0, x: -120, y: -60 }, { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, 25.4);
      tl.to("#cursor", { scale: 0.85, duration: 0.12, ease: "power2.in" }, 26.55);
      tl.to("#cursor", { scale: 1, duration: 0.15, ease: "power2.out" }, 26.67);
      tl.fromTo("#click-ripple", { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.8, duration: 0.5, ease: "power2.out" }, 26.55);
      tl.to("#cursor", { opacity: 0, duration: 0.2, ease: "power2.in" }, 27.35);
      tl.set("#cursor", { opacity: 0 }, 27.55);

      /* ---------- SCENE E: mechanism ---------- */
      tl.fromTo("#icon-voice", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 27.75);
      tl.fromTo("#text-voice p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 27.9);
      // waveform bars pulse — finite, staggered
      gsap.utils.toArray("#icon-voice svg path").forEach((bar, i) => {
        tl.fromTo(bar, { scaleY: 0.5 }, { scaleY: 1, duration: 0.35, ease: "sine.inOut", repeat: 5, yoyo: true, transformOrigin: "50% 50%" }, 28.1 + i * 0.05);
      });
      tl.to("#text-voice p", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, 30.1);
      tl.set("#text-voice p", { opacity: 0 }, 30.3);

      // dock: voice shrinks + travels from slot H (center 540,1230) to slot D (center 165,1145) —
      // transform-only (x/y/scale), never left/top/width/height, per determinism-rules non-transform-motion.
      tl.to("#icon-voice", { x: -375, y: -85, scale: 130 / 220, duration: 0.2, ease: "power2.inOut" }, 30.3);

      tl.fromTo("#icon-system", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 30.3);
      tl.fromTo("#text-system p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 30.45);
      tl.to("#text-system p", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, 31.7);
      tl.set("#text-system p", { opacity: 0 }, 31.9);
      // gear turns slowly while it "processes"
      tl.fromTo("#icon-system svg", { rotation: 0 }, { rotation: 90, duration: 4.5, ease: "none", transformOrigin: "50% 50%" }, 30.3);

      // connector 1 draws in once dock completes
      const c1 = document.getElementById("connector-1-path");
      const c1len = c1 ? c1.getTotalLength() : 100;
      gsap.set("#connector-1-path", { strokeDasharray: c1len, strokeDashoffset: c1len });
      tl.to("#connector-1-path", { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, 30.5);

      /* ---------- SCENE E: payoff ---------- */
      const c2 = document.getElementById("connector-2-path");
      const c2len = c2 ? c2.getTotalLength() : 100;
      gsap.set("#connector-2-path", { strokeDasharray: c2len, strokeDashoffset: c2len });
      tl.to("#connector-2-path", { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, 31.9);

      tl.fromTo("#icon-envelope-2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 32.0);
      tl.fromTo("#icon-telegram-2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 32.15);
      tl.fromTo("#icon-vk-2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 32.3);

      tl.fromTo("#check-1", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2)" }, 32.5);
      tl.fromTo("#check-2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2)" }, 32.6);
      tl.fromTo("#check-3", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2)" }, 32.7);

      tl.fromTo("#text-payoff p", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 32.6);
      // settle-only tail into outro — no new keyframes after this, freeze holds
      tl.to("#check-3", { scale: 1.05, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 1 }, 32.95);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
